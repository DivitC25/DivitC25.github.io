<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 0 — CS180 Portfolio</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <main class="project-page">
        <a class="back-link" href="../index.html">← Back to portfolio</a>

        <header class="project-header">
            <h1>Project 0</h1>
        </header>

        <section class="part">
            <div class="part-heading">
                <span class="part-meta">Part 1</span>
                <h2>Selfie: The Wrong Way vs. The Right Way</h2>
            </div>
            <div class="comparison">
                <div class="photo-card">
                    <div class="photo-frame">
                        <img src="./media/3016.png" alt="Before — close up selfie">
                    </div>
                    <p class="photo-caption caption-before">Before</p>
                </div>
                <div class="photo-card">
                    <div class="photo-frame">
                        <img src="./media/3026.png" alt="After — stepped back and zoomed in">
                    </div>
                    <p class="photo-caption caption-after">After</p>
                </div>
            </div>
        </section>

        <section class="part">
            <div class="part-heading">
                <span class="part-meta">Part 2</span>
                <h2>Architectural Perspective Compression</h2>
            </div>
            <div class="comparison">
                <div class="photo-card">
                    <div class="photo-frame">
                        <img src="./media/3014.png" alt="Before — zoomed in from a distance">
                    </div>
                    <p class="photo-caption caption-before">Before</p>
                </div>
                <div class="photo-card">
                    <div class="photo-frame">
                        <img src="./media/3015.png" alt="After — walked up to the building">
                    </div>
                    <p class="photo-caption caption-after">After</p>
                </div>
            </div>
        </section>

        <section class="part">
            <div class="part-heading">
                <span class="part-meta">Part 3</span>
                <h2>The Dolly Zoom</h2>
            </div>
            <div class="single-media">
                <div class="photo-frame">
                    <img src="./media/dolly-zoom.gif" alt="Dolly zoom demonstration">
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Divit Chopra · UC Berkeley</p>
    </footer>
</body>
</html>
